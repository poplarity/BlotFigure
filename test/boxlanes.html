<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>box lanes</title></head>
<body><pre id="out">running</pre>
<script src="../js/storage.js"></script><script src="../js/i18n.js"></script><script src="../js/tiff.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/wbladders.js"></script>
<script src="../js/wbengine.js"></script>
<script>
// WB.detectBoxLanes on synthetic boxes with known lanes: every case states the lanes it must find
(() => {
  const WB = window.WB;
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const gauss = () => { let s = 0; for (let i = 0; i < 6; i++) s += rnd(); return (s - 3) / Math.sqrt(0.5); };
  /* a box W x H: bands at the given lane slots (pitch P, first lane centre x0), each `bw` wide and `bh` high
   * at mid height, amplitude amp (per lane, or one value); twoLobe: a dip in the middle of each band */
  function box(o) {
    const W = o.W, H = o.H || 120, d = new Float32Array(W * H), amps = o.amps || o.lanes.map(() => o.amp || 0.5);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let v = o.bg != null ? o.bg : 0.05;
      o.lanes.forEach((m, i) => {
        const cx = o.x0 + m * o.P, dx = (x - cx) / (o.bw / 2), dy = (y - H / 2 - (o.smile ? o.smile * dx * dx : 0)) / (o.bh / 2);
        let s = Math.exp(-(dx ** 4) - (dy ** 2) * 2);
        if (o.twoLobe) s *= 1 - 0.6 * Math.exp(-(dx * dx) * 6);
        v += amps[i] * s;
      });
      v += (o.noise || 0.004) * gauss();
      d[y * W + x] = v;
    }
    return { w: W, h: H, data: d };
  }
  const cases = [
    { name: '6 lanes, membrane spacing right', o: { W: 300, P: 44, x0: 40, bw: 28, bh: 14, lanes: [0, 1, 2, 3, 4, 5] }, P0: 44, want: 6 },
    { name: '6 lanes, membrane spacing half the real one', o: { W: 300, P: 44, x0: 40, bw: 28, bh: 14, lanes: [0, 1, 2, 3, 4, 5] }, P0: 22, want: 6 },
    { name: '6 lanes, no spacing given', o: { W: 300, P: 44, x0: 40, bw: 28, bh: 14, lanes: [0, 1, 2, 3, 4, 5] }, P0: 0, want: 6 },
    { name: 'bands in lanes 1, 3, 5 only (2 and 4 empty)', o: { W: 300, P: 44, x0: 40, bw: 28, bh: 14, lanes: [0, 2, 4] }, P0: 44, want: 5 },
    { name: 'marker gaps: 2 + gap + 2 + gap + 2', o: { W: 380, P: 44, x0: 30, bw: 28, bh: 14, lanes: [0, 1, 3, 4, 6, 7] }, P0: 44, want: 8 },
    { name: 'noise only', o: { W: 300, P: 44, x0: 40, bw: 28, bh: 14, lanes: [], noise: 0.01 }, P0: 44, want: 0, atMost: 1 },
    { name: 'faint bands (SNR ~6)', o: { W: 300, P: 44, x0: 40, bw: 28, bh: 14, lanes: [0, 1, 2, 3, 4, 5], amp: 0.03, noise: 0.005 }, P0: 44, want: 6 },
    { name: 'one strong band, five weak', o: { W: 300, P: 44, x0: 40, bw: 28, bh: 14, lanes: [0, 1, 2, 3, 4, 5], amps: [0.9, 0.06, 0.05, 0.08, 0.06, 0.05] }, P0: 44, want: 6 },
    { name: 'two-lobed bands', o: { W: 300, P: 44, x0: 40, bw: 32, bh: 14, lanes: [0, 1, 2, 3, 4, 5], twoLobe: true }, P0: 44, want: 6 },
    { name: 'two-lobed bands, no spacing given', o: { W: 300, P: 44, x0: 40, bw: 32, bh: 14, lanes: [0, 1, 2, 3, 4, 5], twoLobe: true }, P0: 0, want: 6 },
    { name: 'smiling bands', o: { W: 300, P: 44, x0: 40, bw: 30, bh: 12, lanes: [0, 1, 2, 3, 4, 5], smile: 4 }, P0: 44, want: 6 },
    { name: 'sloppy box: wide empty margins', o: { W: 520, P: 44, x0: 150, bw: 28, bh: 14, lanes: [0, 1, 2, 3, 4] }, P0: 44, want: 5 },
    { name: '4 lanes, spacing 2/3 of the membrane one', o: { W: 260, P: 44, x0: 50, bw: 26, bh: 14, lanes: [0, 1, 2, 3] }, P0: 66, want: 4 },
    { name: 'saturated wide bands nearly touching', o: { W: 300, P: 44, x0: 40, bw: 40, bh: 20, lanes: [0, 1, 2, 3, 4, 5], amp: 1.2 }, P0: 44, want: 6 },
    { name: 'tall box, band in its upper part', o: { W: 300, H: 260, P: 44, x0: 40, bw: 28, bh: 14, lanes: [0, 1, 2, 3, 4, 5] }, P0: 44, want: 6 }
  ];
  cases.push(
    { name:'fixed 6 ignores wrong membrane pitch', o:{W:300,P:44,x0:40,bw:28,bh:14,lanes:[0,1,2,3,4,5]},P0:22,count:6,want:6 },
    { name:'fixed 6 includes a missing last lane', o:{W:300,P:44,x0:40,bw:28,bh:14,lanes:[0,2,4]},P0:80,count:6,want:6 },
    { name:'fixed 5 with wide blank margins', o:{W:520,P:44,x0:150,bw:28,bh:14,lanes:[0,1,2,3,4]},P0:90,count:5,want:5 },
    { name:'fixed 6 handles lobed bands', o:{W:300,P:44,x0:40,bw:32,bh:14,lanes:[0,1,2,3,4,5],twoLobe:true},P0:22,count:6,want:6 },
    { name:'fixed 6 faint unequal bands', o:{W:300,P:44,x0:40,bw:28,bh:14,lanes:[0,1,2,3,4,5],amps:[.8,.04,.06,.05,.07,.04]},P0:25,count:6,want:6 }
  );
  const out = [];
  let fails = 0;
  cases.forEach(c => {
    const img = box(c.o), F = WB.frame(img.w / 2, img.h / 2, 0);
    const r = WB.detectBoxLanes(img, F, -img.w / 2, img.w / 2, -img.h / 2, img.h / 2, { pitch: c.P0, count:c.count });
    const xs = r.lanes.map(u => Math.round(u + img.w / 2));
    // where the lanes should be: first..last band slot (empty slots between included)
    const ok = c.atMost != null ? xs.length <= c.atMost : xs.length === c.want &&
      xs.every((x, i) => Math.abs(x - (c.o.x0 + (Math.min(...c.o.lanes) + i) * c.o.P)) <= 4);
    if (!ok) fails++;
    out.push(`${ok ? 'ok  ' : 'FAIL'} ${c.name}: ${xs.length} lanes (want ${c.atMost != null ? '≤' + c.atMost : c.want}) p=${r.pitch.toFixed(1)} at ${xs.join(',')}`);
  });
  for(const count of [1,6,60]) {
    const img={w:300,h:100,data:new Float32Array(300*100)}, r=WB.detectBoxLanes(img,WB.frame(150,50,0),-150,150,-50,50,{count});
    const ok=r.lanes.length===count&&r.lanes.every(Number.isFinite)&&!r.confident;
    if(!ok)fails++;out.push(`${ok?'ok  ':'FAIL'} fixed ${count} blank fallback`);
  }
  document.getElementById('out').textContent = out.join('\n');
  window.__done = true;      // (tests/run.mjs waits for it)
  document.title = 'BOX ' + JSON.stringify({ fails, out });
})();
</script></body></html>
